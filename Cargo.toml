[workspace]
members = [
  "crates/eiger-api",
  "crates/eiger-browser",
  "crates/eiger-config",
  "crates/eiger-metrics",
  "crates/eiger-pool",
  "crates/eiger-server",
  "crates/eiger-stealth",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/eiger-browser/eiger"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["json", "query", "ws"] }
chrono = { version = "0.4", features = ["clock", "serde"] }
dashmap = "6"
futures-util = "0.3"
http = "1"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
tower-http = { version = "0.6", features = ["cors", "timeout", "trace"] }
tower_governor = { version = "0.8", default-features = false, features = ["axum"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
urlencoding = "2"
uuid = { version = "1", features = ["serde", "v4"] }
